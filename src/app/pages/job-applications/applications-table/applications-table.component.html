<div class="table-functionality">
  <section>
    <mat-checkbox
      [checked]="filterSettings().showActiveApplicationsOnly"
      (change)="toggleActiveApplications()"
    >
      Active Only
    </mat-checkbox>

    <mat-checkbox
      [checked]="filterSettings().showMostRecent"
      (change)="toggleMostRecent()"
    >
      Most Recent Activity
    </mat-checkbox>
  </section>
  <div class="subtitle">(sorted by most recent activity)</div>
</div>

<table mat-table [dataSource]="pagedApplications" class="mat-elevation-z8">
  <!-- Company Column -->
  <ng-container matColumnDef="company">
    <th mat-header-cell *matHeaderCellDef>Company</th>
    <td mat-cell *matCellDef="let element;">{{ element.company }}</td>
  </ng-container>

  <!-- Company Position -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Position Title</th>
    <td mat-cell *matCellDef="let element;">{{ element.title }}</td>
  </ng-container>

  <!-- Application Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let element;">{{ element.active ? 'Active' : 'Inactive' }}</td>
  </ng-container>

  <!-- Application Date -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>{{ date.title }}</th>
    <td mat-cell *matCellDef="let element;">{{ getDate(element) }}</td>
  </ng-container>

  <!-- Application Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element; let index = index">
      <button
      mat-icon-button
      type="button"
      matTooltip="Application Tracking"
      [attr.data-testid]="'button--edit-application--' + index"
      (click)="editTracking(index)"
    >
      <mat-icon>fact_check</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      matTooltip="Edit Application"
      [attr.data-testid]="'button--edit-application--' + index"
      (click)="navigate('edit', index)"
    >
      <mat-icon>edit</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      matTooltip="Delete Application"
      [attr.data-testid]="'button--delete-application--' + index"
      (click)="delete(index)"
    >
      <mat-icon>delete</mat-icon>
    </button>
    </td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns"
    class="table-header-row"
  ></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
    class="table-default-row"
    [style]="getLastTrackingTagStyle(row)"
  ></tr>
</table>

<job-squid-table-paging
  [data]="filteredApplications"
  (change)="handlePageChange($event)"
/>
